name: Reviewed image build
on:
  workflow_dispatch:
    inputs:
      approved_commit:
        description: Exact reviewed integration commit
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: reviewed-image-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      APPROVED_COMMIT: ${{ inputs.approved_commit }}
    steps:
      - name: Checkout reviewed integration commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Build and verify without provider credentials
        shell: bash
        run: bash scripts/build.sh
      - name: Publish once and read back registry digest
        env:
          REGISTRY_TOKEN: ${{ secrets.NEBIUS_TRANSFER_ACCESS_TOKEN }}
        shell: bash
        run: bash scripts/publish.sh
      - name: Remove private files and owned containers
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/cirujano-build-$GITHUB_RUN_ID"
          for owned in "cirujano-probe-$GITHUB_RUN_ID" "cirujano-publish-$GITHUB_RUN_ID"; do
            timeout --kill-after=5s 10s docker rm -f "$owned" >/dev/null 2>&1 || true
            if ! live=$(timeout --kill-after=5s 10s docker ps -a --filter "name=^/$owned$" --format '{{.ID}}'); then
              echo owned-container-cleanup-unverified; exit 1
            fi
            test -z "$live" || { echo owned-container-cleanup-incomplete; exit 1; }
          done
